name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MESON_VERSION: 1.7.2

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-16
            image: gcc:16
            cc: gcc
            cxx: g++
            toolchain_args: '-Dcpp_rtti=false'
            extra_packages: ''
          - name: clang-21
            image: silkeh/clang:21-trixie
            cc: clang
            cxx: clang++
            toolchain_args: ''
            extra_packages: libstdc++-14-dev
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev ${{ matrix.extra_packages }} \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure git
        run: git config --global --add safe.directory '*'
      - name: Report toolchain
        run: |
          "$CXX" --version
          meson --version
          ninja --version
      - name: Configure
        run: meson setup buildDir --wrap-mode=nodownload -Dlinux_window_system=x11 ${{ matrix.toolchain_args }}
      # 新增测试必须声明 suite：sanitize 任务按 suite 选取要跑的子集，而不是维
      # 护手写名单。漏声明的测试会静默失去 ASan/UBSan 覆盖，所以在这里直接拦下。
      - name: Assert every test declares a suite
        run: |
          # `meson test --list` 对已声明 suite 的测试打印 "<suite> - <project>:<name>"，
          # 未声明时只打印 "<project>:<name>"。按分隔符判断，新增 suite 不会误报。
          untagged=$(meson test -C buildDir --list | grep -v -- ' - ' || true)
          if [ -n "$untagged" ]; then
            echo "::error::these tests declare no suite and would escape sanitizer coverage:"
            echo "$untagged"
            exit 1
          fi
      - name: Build
        run: meson compile -C buildDir
      - name: Test
        run: meson test -C buildDir --print-errorlogs

  sanitize:
    name: sanitize (Clang 21, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: silkeh/clang:21-trixie
    env:
      CC: clang
      CXX: clang++
      # 字体管线泄漏属于测试局部资源（生产 teardown 由应用关闭流程覆盖），
      # 暂关闭泄漏检测，保留 UAF/UB 检测。
      LSAN_OPTIONS: detect_leaks=0
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev libstdc++-14-dev \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure git
        run: git config --global --add safe.directory '*'
      - name: Configure
        run: meson setup buildDir-asan -Db_sanitize=address,undefined -Dlinux_window_system=x11 --wrap-mode=nodownload
      - name: Build
        run: meson compile -C buildDir-asan
      - name: Test (unit suite under ASan + UBSan)
        run: |
          # `unit` = 全部 C++ 单测。window-lifecycle 在无显示环境下会自报 skipped 并以
          # 成功退出，所以可以安全纳入。慢速的 Python CLI / 构建工作流测试标为
          # `integration`，由常规构建任务与 sqlite-fallback 任务覆盖。
          # 不要改回手写名单：那正是新组件静默脱离 sanitizer 覆盖的原因。
          meson test -C buildDir-asan --print-errorlogs --suite unit

  sqlite-fallback:
    name: SQLite fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: gcc:16
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev \
            libssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure git
        run: git config --global --add safe.directory '*'
      - name: Configure
        run: meson setup buildDir-fallback --force-fallback-for=sqlite3 -Dlinux_window_system=x11
      - name: Build
        run: meson compile -C buildDir-fallback
      - name: Test resource workflow
        run: |
          meson test -C buildDir-fallback --print-errorlogs \
            resource nanres-cli portable-stage nanres-build-workflow \
            nandina-subproject-fixture font-resource application-resource

  physics:
    name: physics (Box2D enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: gcc:16
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure git
        run: git config --global --add safe.directory '*'
      - name: Configure
        run: meson setup buildDir-physics -Dphysics2d=enabled -Dlinux_window_system=x11 --wrap-mode=nodownload
      - name: Build
        run: meson compile -C buildDir-physics
      - name: Test physics
        run: meson test -C buildDir-physics physics2d --print-errorlogs
